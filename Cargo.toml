# Workspace root: groups our three crates so they build together
# and share a single target/ folder and Cargo.lock.
[workspace]
resolver = "3"
members = ["server", "client", "shared"]

# Versions declared once here; each crate opts in with `dep.workspace = true`.
# This keeps client and server on identical versions of shared libraries.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
