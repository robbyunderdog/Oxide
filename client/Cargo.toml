[package]
name = "client"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

# egui's official app framework: creates the window and runs the render loop.
eframe = "0.32"
# Async runtime for networking, running on background threads.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# HTTP client. rustls = pure-Rust TLS, so https works without OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# WebSocket client.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
# `StreamExt::next()` for reading the WebSocket stream.
futures-util = "0.3"

# ---- End-to-end encryption (all from the audited RustCrypto / dalek projects) ----
# Password -> master key (memory-hard, resists GPU brute force).
argon2 = "0.5"
# Splits one master key into independent sub-keys.
hkdf = "0.12"
sha2 = "0.10"
# Elliptic-curve Diffie-Hellman: two people derive the same secret from
# (my private key, your public key) without ever sending it.
x25519-dalek = { version = "2", features = ["static_secrets"] }
# Authenticated encryption: confidentiality + tamper detection.
chacha20poly1305 = "0.10"
# Secure randomness from the OS for keys and nonces.
rand_core = { version = "0.6", features = ["getrandom"] }
# Wipes key material from memory when it's dropped.
zeroize = "1"
